<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Transvilles · Mes bus</title>
<style>
:root{--bg:#0b0d12;--gl:rgba(255,255,255,.09);--bd:rgba(255,255,255,.2);--tx:#f4f6fa;--mu:#a3abbb;--ac:#ff6a4d;--sh:rgba(0,0,0,.35);box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#eceef3;--gl:rgba(255,255,255,.55);--bd:rgba(255,255,255,.9);--tx:#14161b;--mu:#5b6270;--ac:#d6341f;--sh:rgba(40,50,80,.18)}}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0 auto;color:var(--tx);font:16px system-ui,-apple-system,sans-serif;max-width:520px;padding:12px;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:#d6341f;top:-20vmax;left:-15vmax}
.bg i:nth-child(2){width:50vmax;height:50vmax;background:#6b7280;bottom:-15vmax;right:-12vmax}
.bg i:nth-child(3){width:30vmax;height:30vmax;background:#ff9a6b;top:40%;left:50%;opacity:.35}
.g,.card,.chip,.row,input{background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 10px 32px var(--sh);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;border-radius:26px;padding:10px 16px;margin-bottom:12px}
.logo{height:42px;background:rgba(255,255,255,.88);border-radius:14px;padding:5px 10px}
#clock{font-size:34px;font-weight:700;letter-spacing:-1px}
.g{border-radius:26px;padding:14px;margin:10px 0}
input{width:100%;padding:14px 16px;border-radius:18px;font-size:17px;margin:4px 0;outline:0}
input::placeholder{color:var(--mu)}
.card{border-radius:26px;padding:14px 16px;margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.chip{border-radius:22px;padding:10px 15px;font-size:15px;white-space:nowrap;cursor:pointer}
.row{display:block;width:100%;text-align:left;border-radius:16px;padding:12px 14px;margin:4px 0;font-size:16px;cursor:pointer}
.ln{display:flex;align-items:center;gap:12px}
.b{min-width:50px;text-align:center;padding:9px 6px;border-radius:14px;font-weight:800;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.d{flex:1;min-width:0}.d b{display:block;font-size:16px}.d small{display:block;color:var(--mu);margin-top:2px}
.m{font-size:46px;font-weight:800;color:var(--ac);line-height:1;text-align:right}.m small{font-size:15px;color:var(--mu);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center}.nm{font-size:21px;display:block}.top small{color:var(--mu)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}.tap,.opn{position:relative;cursor:pointer}.ls{position:absolute;top:4px;right:10px;font-size:19px;color:var(--ac);z-index:2;padding:4px;cursor:pointer}.dl em{font-style:normal}.slot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.slot span{color:var(--mu);font-size:14px}.slot input{width:auto;flex:1;min-width:110px;padding:8px 10px;margin:0}.d small.warn{color:#ffb020;font-weight:600}.wn .m{opacity:.35;text-decoration:line-through}.dl{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-top:1px solid var(--bd)}.dl b{font-size:19px;min-width:62px}.dl span{color:var(--mu);flex:1;text-align:center}.dl span:last-child{text-align:right}.opn .ln{margin-bottom:8px}
.star{background:none;border:0;font-size:28px;color:var(--ac);cursor:pointer}
#st{color:var(--mu);font-size:14px;margin:8px 4px}
.cb{position:relative}.dd{max-height:48vh;overflow:auto;padding:6px;margin:4px 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.dd[hidden]{display:none}
.dd .row{display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;background:transparent;border:0;border-bottom:1px solid var(--bd);border-radius:0;margin:0;padding:13px 8px}
.dd .row small{color:var(--mu);white-space:nowrap}.dd .loc{color:var(--ac);font-weight:700}
.dl b.rem{font-size:27px;min-width:98px;color:var(--ac);line-height:1}.dl .at{font-size:15px;color:var(--tx)}.dl .ar{font-size:11px;text-align:right}.d small.ar2{font-size:11px;opacity:.85}
#mic{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:0;font-size:30px;background:var(--ac);color:#fff;box-shadow:0 8px 24px var(--sh),inset 0 1px 0 rgba(255,255,255,.4);z-index:15;cursor:pointer;padding:0}
#ai{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;z-index:20;padding:12px 14px}
#ai[hidden]{display:none}.aih{display:flex;justify-content:space-between;align-items:center}
#ait{color:var(--mu);font-size:15px;min-height:20px;margin:6px 0}#aia{font-size:17px;line-height:1.4;max-height:34vh;overflow:auto}
.lis #mic,.lis #aim{animation:pl 1.1s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,106,77,.65)}100%{box-shadow:0 0 0 20px rgba(255,106,77,0)}}
.lc{display:flex;flex-wrap:wrap;gap:8px;max-height:34vh;overflow:auto;padding:2px}#lb{margin:8px 0 0}#lp{margin-top:6px}
.lb{min-width:54px;border:2px solid transparent;border-radius:14px;padding:9px 8px;font-weight:800;font-size:17px;opacity:.55;cursor:pointer;font-family:inherit}.lb.on{opacity:1;border-color:var(--tx);box-shadow:0 0 0 3px var(--ac)}
.sprow{display:flex;gap:8px}.sp{flex:1;margin:10px 0;padding:10px 14px}.sp small{display:block;color:var(--mu);font-size:12px}.sp b{font-size:18px}
.hl{outline:3px solid var(--ac);outline-offset:2px;animation:fl .6s ease-in-out infinite alternate}
@keyframes fl{from{box-shadow:0 0 0 0 rgba(255,106,77,0)}to{box-shadow:0 0 34px 8px rgba(255,106,77,.85)}}
#tb{position:fixed;left:10px;right:92px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:15;padding:6px;margin:0;border-radius:32px}#tb[hidden]{display:none}#tb input{margin:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;min-height:0;padding:8px 12px}
[hidden]{display:none!important}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
header.g{padding:6px 12px;margin:0 0 6px;flex:none;gap:8px}.logo{height:34px;padding:4px 8px}#clock{font-size:28px}
.hr{display:flex;align-items:center;gap:8px}
#reset{padding:0;width:40px;height:40px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center}
#mic{position:static;width:44px;height:44px;font-size:22px;flex:none;box-shadow:0 4px 14px var(--sh),inset 0 1px 0 rgba(255,255,255,.4)}
#fav{flex:none;padding:2px}#fav .chip{padding:7px 13px;font-size:14px}
.pick{flex:none;position:relative;z-index:20;padding:8px;margin:6px 0}
.prow{display:flex;gap:6px;align-items:center}.prow .cb{flex:1;min-width:0;position:static}.prow input{margin:0;padding:11px 12px;font-size:16px}
#lb{margin:0;flex:none;padding:10px 13px;font-size:17px}
.dd{position:absolute;left:0;right:0;top:100%;margin:6px 0 0;z-index:30;max-height:min(52vh,430px);background:var(--bg)}
#lp{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:30;background:var(--bg);border:1px solid var(--bd);border-radius:22px;padding:12px;max-height:min(52vh,430px);overflow:auto;box-shadow:0 14px 40px var(--sh)}
#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#view>.card,#view>.ctl{flex:none;margin:4px 0}.top{padding:8px 14px}
.ctl .chip{padding:7px 12px;font-size:14px}
#list{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;margin-top:4px}#list>*{flex:none}#list .card{margin:0}
.pager{align-self:center}.pager2{display:block;margin:8px auto 0}
.opn .dl{padding-right:38px}.opn .ls{top:12px;right:14px}
#tb{left:10px;right:10px;bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}
#st{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;margin:0 auto;text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}#st:empty{display:none}#st:not(:empty){padding:8px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--bd)}
#setup{position:fixed;left:10px;right:10px;top:calc(72px + env(safe-area-inset-top,0px));max-width:500px;margin:0 auto;z-index:40;background:var(--bg)}
.pager2,.pager{font-size:14px;padding:8px 16px}
.sec{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:12px 8px 4px}a{color:var(--ac)}
@media (orientation:landscape) and (max-height:520px){
 body{max-width:none;padding:6px calc(14px + env(safe-area-inset-right,0px)) 6px calc(14px + env(safe-area-inset-left,0px))}
 header{padding:6px 14px;margin-bottom:6px}.logo{height:32px}#clock{font-size:28px}
 .pick,#fav,.ctl,#rw,#st,#mic,#ai,#tb,#reset{display:none}
 #view{display:grid;grid-template-columns:1fr 1fr;gap:8px}#view .card{margin:0}.full{grid-column:1/-1}
 .m{font-size:60px}.nm{font-size:20px}
 html,body{background:#000}.bg{display:none}body{font-family:ui-monospace,Menlo,Consolas,monospace}
 header,#view .card{background:#060606;border:1px solid #2b2b2b;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:#ffb000}
 #view .card{border-radius:12px;padding:8px 16px}#view{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:6px}.star,.ls{display:none}
 #clock,.nm,.d b,.m{color:#ffb000;text-shadow:0 0 9px rgba(255,176,0,.65)}.d b{text-transform:uppercase;letter-spacing:1px;font-size:20px}
 .d small,.m small,.top small,.dl span{color:#a87400;text-shadow:none}.m{font-size:50px}.b{border-radius:6px;font-size:24px;min-width:64px}.dl b{color:#ffb000}
}

async function load(buf){
 try{
  msg('Lecture des horaires… (quelques secondes)');

let REC=null;const lis=()=>document.body.classList.contains('lis'),setLis=on=>document.body.classList.toggle('lis',on);
